<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>月下 · 气泡</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 14px/1.55 "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding: 0 10px 12px; box-sizing: border-box; }
  .bubble {
    position: relative; max-width: 270px; min-width: 96px; padding: 9px 14px 10px; border-radius: 16px; cursor: pointer;
    color: #fbeef1; background: linear-gradient(160deg, rgba(58, 28, 43, .97), rgba(31, 17, 27, .97));
    border: 1px solid rgba(216, 173, 123, .55); box-shadow: 0 6px 18px rgba(10, 4, 8, .45), inset 0 0 0 1px rgba(255, 255, 255, .04);
    opacity: 0; transform: translateY(6px) scale(.97); transition: opacity .22s ease, transform .22s ease;
  }
  .bubble.on { opacity: 1; transform: none; }
  .bubble:hover { border-color: rgba(232, 190, 140, .9); }
  .meta { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; color: #d8ad7b; font-size: 11px; letter-spacing: .5px; }
  .meta svg { width: 16px; height: 10px; flex: none; fill: #d8ad7b; }
  #caption { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; color: #b99aa8; }
  #caption:empty { display: none; }
  .voice { margin-left: auto; display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  .voice i { width: 2px; height: 3px; background: #e9b9a0; border-radius: 1px; }
  .voice.loading i { animation: dot 1.2s infinite ease-in-out; height: 3px; }
  .voice.loading i:nth-child(2) { animation-delay: .2s; }
  .voice.loading i:nth-child(3) { animation-delay: .4s; }
  .voice.speaking i { animation: bar .7s infinite ease-in-out; }
  .voice.speaking i:nth-child(2) { animation-delay: .15s; }
  .voice.speaking i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes bar { 0%, 100% { height: 3px; } 50% { height: 10px; } }
  #text { margin: 0; word-break: break-word; }
  .tail { position: absolute; bottom: -7px; width: 12px; height: 12px; transform: translateX(-50%) rotate(45deg); background: #22121c; border-right: 1px solid rgba(216, 173, 123, .55); border-bottom: 1px solid rgba(216, 173, 123, .55); }
</style>
<div id="wrap">
  <div id="bubble" class="bubble" title="点击和月下聊天">
    <div class="meta">
      <svg viewBox="0 0 32 20" aria-hidden="true"><path d="M16 6c1-2 2-3 3-3-1 2-1 3 0 4 3-3 7-4 13-3-3 1-5 3-6 6-2-1-4-1-5 1-1 3-3 5-5 7-2-2-4-4-5-7-1-2-3-2-5-1-1-3-3-5-6-6 6-1 10 0 13 3 1-1 1-2 0-4 1 0 2 1 3 3z"/></svg>
      <span>月下</span><span id="caption"></span><span id="voice" class="voice"><i></i><i></i><i></i></span>
    </div>
    <p id="text"></p>
    <i id="tail" class="tail"></i>
  </div>
</div>
<script type="module" src="./bubble.js"></script>
</html>
